<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ربات موازی ۲ لینک - گوهری‌منش</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="panel">
            <h1>ربات موازی ۲ لینک</h1>
            
            <div class="section">
                <label>متن برای ترسیم:</label>
                <input type="text" id="textInput" placeholder="مثلاً: سلام" value="سلام">
                <button id="drawTextBtn" class="btn green">✏️ ترسیم متن</button>
            </div>
            
            <div class="section">
                <label>موقعیت هدف:</label>
                <div class="coords">
                    <span>X: <b id="xVal">0</b></span>
                    <span>Y: <b id="yVal">150</b></span>
                </div>
                <input type="range" id="xSlider" min="-200" max="200" value="0">
                <input type="range" id="ySlider" min="-150" max="300" value="150">
            </div>
            
            <div class="section">
                <button id="clearBtn" class="btn red">🗑️ پاک کردن مسیر</button>
                <button id="wsBtn" class="btn blue">📐 نمایش فضای کاری</button>
            </div>
            
            <div class="section info">
                <p><b>زاویه موتور چپ:</b> <span id="angLeft">-</span>°</p>
                <p><b>زاویه موتور راست:</b> <span id="angRight">-</span>°</p>
            </div>
            
            <footer>
                <p>طراح: محمدرضا گوهری‌منش</p>
                <p>استاد: دکتر مسعود گوهری‌منش</p>
                <p>دانشگاه تربت حیدریه</p>
            </footer>
        </aside>
        
        <main class="canvas-wrap">
            <canvas id="robotCanvas"></canvas>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
